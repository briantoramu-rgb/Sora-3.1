<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sora 3.1 — Criador de imagens e vídeos</title>
<style>
:root{--bg:#0d0d12;--panel:#17171f;--panel2:#20202b;--text:#f7f4f2;--muted:#aaa8b5;--accent:#ff6848;--accent2:#ff315d;--line:#30303b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#34202b 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
aside{border-right:1px solid var(--line);padding:24px 16px;background:#101016e8}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 30px}.brand img{width:44px;height:44px;object-fit:cover;border-radius:13px}.brand strong{display:block;font-size:18px;letter-spacing:-.5px}.brand small{color:var(--muted);font-size:11px;letter-spacing:1.5px}
.nav{display:grid;gap:8px}.nav button{border:0;text-align:left;color:#c7c3ce;background:transparent;border-radius:12px;padding:12px 14px}.nav button.active,.nav button:hover{background:#302029;color:white}.nav .ico{display:inline-block;width:28px;color:#ff9276}
.side-note{position:absolute;bottom:22px;left:24px;right:auto;max-width:200px;color:#8f8c99;font-size:12px}
main{padding:34px clamp(18px,4vw,58px) 60px;max-width:1400px;width:100%;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:34px}.eyebrow{color:#ff997f;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:2px}.top h1{font-size:clamp(26px,3vw,38px);letter-spacing:-1.4px;line-height:1.1;margin:8px 0}.sub{color:var(--muted);max-width:650px}.pill{border:1px solid #5b3b40;border-radius:999px;padding:7px 12px;color:#ffb5a1;font-size:12px;white-space:nowrap}
.layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(280px,.85fr);gap:22px;align-items:start}
.panel{background:linear-gradient(160deg,#1b1b25,#15151d);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 18px 55px #0002}
.panel h2{font-size:16px;margin:0 0 18px;letter-spacing:-.3px}.label{display:block;color:#d7d2dc;font-weight:650;font-size:13px;margin:18px 0 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode{border:1px solid var(--line);background:#111119;color:#bdb9c5;padding:13px;border-radius:12px;text-align:left}.mode strong{display:block;color:inherit}.mode span{font-size:12px;color:#9995a2}.mode.active{border-color:#ff795d;background:#3a2026;color:white;box-shadow:inset 0 0 0 1px #ff795d}
textarea,input,select{width:100%;background:#101017;border:1px solid #373541;border-radius:12px;padding:12px 13px;color:#fff;outline:none}textarea{resize:vertical;min-height:130px}textarea:focus,input:focus,select:focus{border-color:#ff795d}textarea::placeholder,input::placeholder{color:#777482}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{color:#85818e;font-size:12px;margin-top:7px}.primary{width:100%;border:0;border-radius:13px;padding:14px 18px;margin-top:22px;background:linear-gradient(100deg,#ff8a4f,#f52f5f);color:white;font-weight:800;box-shadow:0 9px 24px #f43d5a2b}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.preview{min-height:460px;display:flex;flex-direction:column}.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.preview-head h2{margin:0}.status{font-size:11px;color:#b2aeb9;background:#292833;padding:6px 9px;border-radius:999px}
.canvas{flex:1;min-height:300px;border:1px dashed #45414f;border-radius:15px;background:radial-gradient(ellipse at center,#28202b,#111118 72%);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.empty{text-align:center;padding:25px;max-width:300px}.empty .spark{font-size:42px;display:block;margin-bottom:12px}.empty strong{display:block;font-size:15px}.empty p{font-size:13px;color:var(--muted)}
#result{width:100%;height:100%;min-height:300px;display:none;object-fit:contain}.result-text{display:none;padding:22px;color:#ded9e2;white-space:pre-wrap;word-break:break-word}
.actions{display:flex;gap:10px;margin-top:14px}.secondary{flex:1;background:#24232e;border:1px solid #393744;border-radius:11px;padding:11px;color:#eee}.secondary:disabled{opacity:.4;cursor:not-allowed}
.notice{margin-top:16px;color:#aaa6b2;font-size:12px;line-height:1.5}.notice b{color:#e9e4ec}
footer{color:#777482;font-size:12px;text-align:center;margin-top:30px}
@media(max-width:850px){.app{grid-template-columns:1fr}aside{position:static;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}.brand{padding:0}.brand img{width:36px;height:36px}.nav,.side-note{display:none}main{padding-top:25px}.layout{grid-template-columns:1fr}.preview{min-height:390px}}
@media(max-width:440px){.top{align-items:flex-start;flex-direction:column}.two{grid-template-columns:1fr}.panel{padding:17px}}
</style>
</head>
